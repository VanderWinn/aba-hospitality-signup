name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site/css _site/js _site/data _site/assets
          cp index.html .nojekyll _site/
          cp css/styles.css _site/css/
          cp js/config.js js/catalog.js js/app.js _site/js/
          cp data/seed.json _site/data/
          cp assets/aba-logo.png assets/favicon.ico assets/favicon-32.png assets/favicon-180.png _site/assets/

      - name: Stamp asset versions
        run: |
          short="${GITHUB_SHA:0:7}"
          test -n "$short"
          sed -i "s/__ASSET_VERSION__/${short}/g" _site/index.html
          grep -q "css/styles.css?v=${short}" _site/index.html
          grep -q "js/catalog.js?v=${short}" _site/index.html
          grep -q "js/config.js?v=${short}" _site/index.html
          grep -q "js/app.js?v=${short}" _site/index.html
          if grep -q '__ASSET_VERSION__' _site/index.html; then
            echo "Asset version placeholder was not replaced"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for the Pages artifact
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
